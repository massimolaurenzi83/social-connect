# Aggiorna i feed aggregati ogni 5 minuti e li pubblica nel repository.
# GitHub Pages (attivo sul branch main) serve automaticamente i dati freschi.
# Nota: 5 minuti è l'intervallo minimo consentito da GitHub Actions; nei momenti
# di carico elevato l'esecuzione può slittare di qualche minuto.

name: Aggrega feed

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/catalog.json"
      - "tools/aggregate.ps1"

permissions:
  contents: write

# con esecuzioni così frequenti evitiamo che due run si pestino i piedi
concurrency:
  group: aggrega-feed
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Esegui aggregatore
        shell: pwsh
        run: ./tools/aggregate.ps1

      - name: Commit dei feed aggiornati
        run: |
          git config user.name "social-connect-bot"
          git config user.email "actions@github.com"
          git add data/feeds data/channels.json
          if git diff --cached --quiet; then
            echo "Nessuna novita: niente commit."
            exit 0
          fi
          git commit -m "chore: aggiornamento feed automatico"
          # se nel frattempo è arrivato un altro commit, riallinea e riprova
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin main || exit 1
          done
          exit 1
